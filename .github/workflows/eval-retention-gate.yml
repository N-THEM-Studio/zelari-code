name: eval-retention-gate

# 2.6 Track A (F11 → 2.6.2): historical-anchor retention gate.
#
# Tier 0 — deterministic unit tests, PR-BLOCKING (unchanged).
# Tier 1 — retention gate vs the LAST STABLE TAG, blocking when a provider
#          key exists: candidate anchors RUN for real (runAnchors --runner
#          headless), the baseline store is extracted from the tag
#          (git archive), and runGate exits non-zero on regression.
#          Without credentials the comparison degrades to an EXPLICIT shadow
#          report (--report-only + ::warning) — it never fakes a green gate.
#          §24 bootstrap: a stable tag with NO seeded store yet SKIPS the
#          comparison with a visible warning (bootstrap state, not a
#          regression); a tag whose store exists but cannot be extracted
#          FAILS LOUD — anchors must not silently disappear from the gate.
#
# seed-baseline (workflow_dispatch) — runs the anchor suite on main and
# commits eval/results/<hash>/ so the next stable tag ships a baseline.

on:
  pull_request:
    paths:
      - 'packages/core/src/**'
      - 'src/cli/**'
      - 'eval/anchors/**'
      - 'tools/eval/**'
      - '.github/workflows/eval-retention-gate.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier0-anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Activate pinned npm
        run: |
          corepack enable
          corepack prepare npm@11.7.0 --activate
          npm --version
      - run: npm ci
      - name: Build core (CLI imports resolve from dist)
        run: npm run build --workspace=@zelari/core
      - name: Eval harness unit tests (anchor format, runner, gate, targeting, store seeding) - BLOCKING Tier 0
        run: npx vitest run tools/eval
      - name: Session + resource invariants (spine replay safety) - BLOCKING Tier 0
        run: npx vitest run packages/core/src/session packages/core/src/runtime packages/core/src/verification/resourceReserveGate.test.ts

  retention-gate:
    runs-on: ubuntu-latest
    needs: tier0-anchors
    env:
      ZELARI_API_KEY: ${{ secrets.ZELARI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Activate pinned npm
        run: |
          corepack enable
          corepack prepare npm@11.7.0 --activate
          npm --version
      - run: npm ci
      - name: Build CLI (headless runner target)
        run: npm run build
      - name: Extract baseline store from last stable tag
        run: |
          BASELINE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo missing)
          echo "baseline tag: $BASELINE_TAG"
          if [ "$BASELINE_TAG" = "missing" ]; then
            echo "::warning::no stable tag yet — retention gate cannot compare (bootstrap; seed via seed-baseline dispatch and tag)"
            echo "BASELINE_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p /tmp/baseline-store
          if ! git archive "$BASELINE_TAG" eval/results 2>/dev/null | tar -x -C /tmp/baseline-store --strip-components=2; then
            if git cat-file -e "$BASELINE_TAG:eval/results" 2>/dev/null; then
              echo "::error::tag $BASELINE_TAG has eval/results but extraction failed — investigate (plan §24: an anchor must not disappear from the gate)."
              exit 1
            fi
            echo "::warning::tag $BASELINE_TAG has no seeded baseline store — retention comparison SKIPPED (bootstrap state, not a regression). Dispatch the 'seed-baseline' workflow once with a provider key, then tag the next release to activate the blocking gate."
            echo "BASELINE_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "BASELINE_AVAILABLE=true" >> "$GITHUB_ENV"
      - name: Run candidate anchors + seed store (real agent runs)
        if: ${{ env.BASELINE_AVAILABLE == 'true' && env.ZELARI_API_KEY != '' }}
        run: node --experimental-strip-types tools/eval/runAnchors.ts --tier 0 --tier 1 --runner headless
      - name: Retention gate vs stable tag baseline - BLOCKING
        if: ${{ env.BASELINE_AVAILABLE == 'true' && env.ZELARI_API_KEY != '' }}
        run: |
          node --experimental-strip-types tools/eval/runGate.ts \
            --baseline latest \
            --baseline-store /tmp/baseline-store \
            --candidate all \
            --preset stable
      - name: Retention gate shadow report (no provider key — never fakes green)
        if: ${{ env.BASELINE_AVAILABLE == 'true' && env.ZELARI_API_KEY == '' }}
        run: |
          echo "::warning::ZELARI_API_KEY absent — candidate anchors NOT run; printing baseline-only shadow report (rollout §28 Phase 1). Add the secret to enable the blocking gate."
          node --experimental-strip-types tools/eval/runGate.ts \
            --baseline latest \
            --baseline-store /tmp/baseline-store \
            --report-only

  seed-baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ZELARI_API_KEY: ${{ secrets.ZELARI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Activate pinned npm
        run: |
          corepack enable
          corepack prepare npm@11.7.0 --activate
          npm --version
      - run: npm ci
      - name: Build CLI (headless runner target)
        run: npm run build
      - name: Run anchor suite (tier 0+1) and seed eval/results
        run: node --experimental-strip-types tools/eval/runAnchors.ts --tier 0 --tier 1 --runner headless --strict
      - name: Commit seeded baseline store
        run: |
          git config user.name "zelari-eval-bot"
          git config user.email "eval-bot@zelari.local"
          git add -f eval/results
          if git diff --cached --quiet; then
            echo "nothing new to seed"
            exit 0
          fi
          git commit -m "eval: seed baseline store (F11 result store)"
          git push
