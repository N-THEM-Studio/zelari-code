name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full gate, single platform: typecheck + full suite + principles + versions.
  # (Exit-3.5: full suite stays on Ubuntu + Node 24; platform variance is
  # covered by the smoke matrix below.)
  verify:
    name: Typecheck · Tests · Principles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Activate pinned npm
        shell: bash
        run: |
          npm install -g npm@11.7.0 --no-fund --no-audit
          hash -r 2>/dev/null || true
          test "$(npm --version)" = "11.7.0"
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # t39: dependency-audit policy — block only on high+ in the root
      # lockfile. Dependabot #6 (moderate) triaged 2026-09-04 as not
      # reproducible: `npm audit` reports 0 vulnerabilities on both the
      # root and apps/desktop lockfiles.
      - name: Audit dependencies (high+ blocking)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit + session replay invariants E1.6/E1.7)
        run: npm test

      - name: Verify first principles (PRINCIPLES.md)
        run: npm run verify:principles

      - name: Version coherence (root vs @zelari/core vs devDep)
        run: npm run verify:versions

  # ADR-0036: flag PRs that touch the judge (the paths that decide safety
  # and measure fitness). Informational label only — never blocks the PR;
  # the hard guarantee stays in verify-principles.mjs ([judge] check).
  touches-judge:
    name: Judge-paths label (ADR-0036)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Label judge-path touches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/touches-judge.mjs "$BASE_SHA" | tee touches-judge.txt
          if grep -q 'touches-judge: yes' touches-judge.txt; then
            gh label create touches-judge --color B60205 \
              --description 'Touches judge paths (ADR-0036) — heightened scrutiny' || true
            gh pr edit "$PR_NUMBER" --add-label touches-judge
          fi

  # Exit-3.5 multi-OS smoke: Zelari touches platform-sensitive surfaces
  # (shell, paths, process groups, signals, worktrees, session locks), so
  # core/session/runtime/verification/mission + CLI spine tests and the
  # bundled binary must run on every supported OS. Node lines: 20 (the
  # runtime floor) and 24. The pinned npm@11.7.0 resolves the
  # same tree on both, so the vite 8 peer-esbuild conflict that once forced
  # 24-only no longer applies; the node:sqlite memory suites skip on 20.
  # Desktop build smoke lives in release-desktop.yml.
  smoke:
    name: Smoke · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # F2.2: one bash step (PATH-safe). Two runner traps, both fatal for
      # reproducible installs:
      # 1) Windows: a separate activate step left npm resolving to the
      #    pre-baked 10.8.2 (stale entry in the bash PATH hash cache), so
      #    `npm ci` failed on esbuild. `hash -r` drops the cached entry.
      # 2) corepack 0.35 `prepare --activate` exits 0 but never redirects
      #    the real `npm` binary: on 2026-09-15 the assert below caught
      #    11.16.0/10.8.2 on all six smoke runners right after a
      #    "successful" activation. `npm i -g npm@<pin>` is the only
      #    deterministic activation; the assert fails fast before any
      #    install runs.
      - name: Activate pinned npm + install (single step, PATH-safe)
        shell: bash
        run: |
          npm install -g npm@11.7.0 --no-fund --no-audit
          hash -r 2>/dev/null || true
          test "$(npm --version)" = "11.7.0"
          npm ci --no-audit --no-fund

      - name: Build @zelari/core
        run: npm run build --workspace=@zelari/core

      - name: Core session/runtime/verification/mission + CLI spine smoke
        run: npx vitest run packages/core/src/session packages/core/src/runtime packages/core/src/verification packages/core/src/mission src/cli/sessionSpine.test.ts src/cli/headlessSpine.test.ts src/cli/headlessSessionEvent.test.ts src/cli/sessionReplayInvariant.test.ts

      - name: CLI bundle + bin smoke (--version)
        run: |
          npx tsc -p tsconfig.json
          node scripts/bundle-cli.mjs
          node bin/zelari-code.js --version
          # ACP front door roundtrip (initialize -> protocolVersion 1) from
          # the real bundle — protocol/framing regressions on every OS.
          npm run smoke:acp

  # Alignment plan, phase 5: surface the app shells in PR CI instead of
  # discovering breakage after the release tag. Desktop regressions used
  # to surface only in release-desktop.yml; the Android companion had no
  # CI at all. Path-filtered so ordinary CLI/core PRs do not pay for them,
  # but shared compile-time deps (root package.json/tsconfig, core) still
  # trigger the desktop job — desktop typechecks against the root package
  # through its `zelari-code: file:../..` dependency.
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute path filters
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Push events have no PR base: run both shell jobs (cheap enough,
          # and main must never break silently).
          if [ -z "$BASE_SHA" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-only "$BASE_SHA"...HEAD || true)
          DESKTOP=$(printf '%s' "$FILES" | grep -cE '^apps/desktop/|^packages/core/|^package\.json$|^tsconfig\.json$' || true)
          ANDROID=$(printf '%s' "$FILES" | grep -c '^apps/companion-android/' || true)
          echo "desktop=$([ "${DESKTOP:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "android=$([ "${ANDROID:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop · frontend build
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Activate pinned npm
        shell: bash
        run: |
          npm install -g npm@11.7.0 --no-fund --no-audit
          hash -r 2>/dev/null || true
          test "$(npm --version)" = "11.7.0"
          npm --version

      # Desktop resolves `zelari-code: file:../..` — the root package must
      # exist (and be built) before its tsc/vite build runs.
      - name: Install + build root CLI
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build Desktop frontend (tsc + vite)
        run: |
          cd apps/desktop
          npm ci --no-audit --no-fund
          npm run build

  desktop-rust:
    name: Desktop · cargo check
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: cargo check (sidecar host)
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  android:
    name: Android · assembleDebug
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: |
          cd apps/companion-android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
