name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v1.9.4)'
        required: true

# Publishes BOTH the CLI (`zelari-code`) and the core library
# (`@zelari/core`) to the npm registry via Trusted Publishing (OIDC).
jobs:
  publish-core:
    name: Publish @zelari/core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Activate pinned npm
        run: |
          corepack enable
          corepack prepare npm@11.7.0 --activate
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Resolve expected version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG_VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Expected version: $TAG_VERSION (from $TAG)"

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -e "console.log(require('./packages/core/package.json').version)")
          if [ "${{ steps.ver.outputs.version }}" != "$PKG_VERSION" ]; then
            echo "Tag version (${{ steps.ver.outputs.version }}) does not match packages/core/package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "✓ Tag matches packages/core @ $PKG_VERSION"

      - name: Build @zelari/core
        run: npm run build --workspace=@zelari/core

      - name: Typecheck (core)
        run: npm run typecheck --workspace=@zelari/core

      - name: Run tests (core)
        run: npm test --workspace=@zelari/core

      - name: Publish @zelari/core
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if npm view "@zelari/core@$VERSION" version >/dev/null 2>&1; then
            echo "@zelari/core@$VERSION is already published; skipping"
          else
            DIST_TAG="latest"
            case "$VERSION" in
              *-alpha*) DIST_TAG="alpha" ;;
              *-beta*) DIST_TAG="beta" ;;
              *-rc.*) DIST_TAG="next" ;;
            esac
            npm publish --workspace=@zelari/core --access public --tag "$DIST_TAG"
          fi

  publish-cli:
    name: Publish zelari-code (CLI)
    needs: publish-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Activate pinned npm
        run: |
          corepack enable
          corepack prepare npm@11.7.0 --activate
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Resolve expected version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG_VERSION="${TAG#v}"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "${{ steps.ver.outputs.version }}" != "$PKG_VERSION" ]; then
            echo "Tag version (${{ steps.ver.outputs.version }}) does not match package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "✓ Tag matches zelari-code @ $PKG_VERSION"

      - name: Build @zelari/core
        run: npm run build --workspace=@zelari/core

      - name: Typecheck
        run: npm run typecheck

      - name: Build CLI
        run: npm run build:cli

      - name: Run tests
        run: npm test

      - name: Smoke test bundled CLI
        run: npm run smoke

      - name: Publish zelari-code
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if npm view "zelari-code@$VERSION" version >/dev/null 2>&1; then
            echo "zelari-code@$VERSION is already published; skipping"
          else
            DIST_TAG="latest"
            case "$VERSION" in
              *-alpha*) DIST_TAG="alpha" ;;
              *-beta*) DIST_TAG="beta" ;;
              *-rc.*) DIST_TAG="next" ;;
            esac
            npm publish --access public --tag "$DIST_TAG"
          fi

  github-release:
    name: Create GitHub Release
    needs: publish-cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Create GitHub Release
        env:
          # RELEASE_TOKEN: fine-grained PAT with "Contents: Read and write" —
          # GITHUB_TOKEN can be forced read-only by org/repo Workflow permissions
          # (403 "Resource not accessible by integration"); PAT bypasses that.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Slice by heading text — never a RegExp. `1.32.0` lives inside `[…]`
          # and YAML→bash→node -e quoting ate `\[`/`\]`/`\z`, producing
          # `/## [1.32.0] - …(?=^## [|z)/` (Unterminated character class).
          # Prefer scripts/changelog-notes.mjs when the checkout has it;
          # fall back inline so workflow_dispatch from main still works
          # against an older tag that lacks the file.
          if [ -f scripts/changelog-notes.mjs ]; then
            NOTES="$(node scripts/changelog-notes.mjs "$TAG")"
          else
            NOTES="$(TAG="$TAG" node <<'NODE'
          const fs = require('fs');
          const tag = process.env.TAG || '';
          const v = tag.replace(/^v/i, '');
          const s = fs.readFileSync('CHANGELOG.md', 'utf8');
          const h = '## [' + v + '] - ';
          const a = s.indexOf(h);
          const b = a < 0 ? -1 : s.indexOf('\n## [', a + h.length);
          console.log(a < 0 ? 'See CHANGELOG.md' : s.slice(a, b < 0 ? undefined : b).trim());
          NODE
          )"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; skipping"
          else
            # Do NOT mark this as GitHub "latest". Desktop auto-update polls
            # /releases/latest/download/latest.json; a notes-only CLI release
            # would 404 that file and break Settings → App updates until
            # Release Desktop uploads signed artifacts. Desktop marks latest
            # after latest.json is attached.
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" --latest=false
          fi
